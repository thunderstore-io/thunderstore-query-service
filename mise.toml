[tools]
python = "3.14.3"
uv = "0.12.1"

[tasks.dev]
run = "uv run fastapi dev src/thunderstore_query_service/main.py"
dir = "."

[tasks.lint]
run = "uv run ruff check ."
dir = "."

[tasks.format]
run = "uv run ruff format . --check"
dir = "."

[tasks.reformat]
run = "uv run ruff format ."
dir = "."

[tasks.test]
run = "uv run pytest"
dir = "."

[tasks.build]
run = "uv build"
dir = "."
