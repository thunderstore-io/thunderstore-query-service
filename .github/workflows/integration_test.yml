name: Integration Test

permissions:
  contents: read

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  integration-test:
    name: 'Integration test'
    runs-on: ubuntu-latest
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Checkout analytics-platform
        env:
          SUBMODULE_TOKEN: ${{ secrets.RISKIDEV_SUBMODULE_PAT }}
        run: |
          git config --global \
            url."https://x-access-token:${SUBMODULE_TOKEN}@github.com/Riskidev/".insteadOf \
            "https://github.com/Riskidev/"
          git submodule update --init --recursive

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Run integration tests
        run: mise run test-integration
