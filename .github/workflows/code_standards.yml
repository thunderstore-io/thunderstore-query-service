name: Code Standards

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  code-standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - name: Run linter
        run: mise run lint
      - name: Run formatter
        run: mise run format
      - name: Check lockfile is up to date
        run: mise run lock-check
