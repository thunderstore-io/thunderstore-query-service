[project]
name = "thunderstore-query-service"
version = "0.1.0"
description = "An API service to query information to gain insight into mods and packages"
readme = "README.md"
authors = [
    { name = "cade", email = "cade.ayres@riskidev.fi" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx2>=2.9.1",
]

[project.scripts]
thunderstore-query-service = "thunderstore_query_service:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]
